name: swipe_iq
description: "Interview questions swipe feed app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  record: ^6.2.1
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.2
  sentry_flutter: ^8.13.2
  googleapis_auth: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/questions/java.json
    - assets/questions/java_advanced.json
    - assets/questions/spring_boot.json
    - assets/questions/hld_concepts.json
    - assets/questions/hld_scenarios.json
    - assets/service_account.json
    - .env
